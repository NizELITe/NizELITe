<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Nizam ul Din Qureshi — AI engineer, co-founder at Earthrenewal.AI</title>
  <desc id="d">A header showing predicted segmentation regions over a field, labelled with the domains he works in.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17241E"/>
      <stop offset="55%" stop-color="#15211F"/>
      <stop offset="100%" stop-color="#132029"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E7B75F"/>
      <stop offset="100%" stop-color="#E7B75F" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="330" rx="14"/></clipPath>
    <clipPath id="panel"><rect x="640" y="0" width="560" height="330"/></clipPath>
  </defs>

  <style>
    .name  { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 52px; font-weight: 700; fill: #F4F1E9; letter-spacing: -0.5px; }
    .role  { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 21px; font-weight: 600; fill: #BFD4C6; }
    .sub   { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15.5px; font-weight: 400; fill: #8CA79A; }
    .cls   { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 12.5px; fill: #E7B75F; letter-spacing: 0.3px; }
    .conf  { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 12.5px; fill: #6F8A7D; }
    .mask  { fill: #5AD1E5; fill-opacity: .10; stroke: #5AD1E5; stroke-width: 1.6; stroke-linejoin: round; }
    .row   { stroke: #2C3F35; stroke-width: 1.4; stroke-linecap: round; }

    .draw  { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1s ease-out forwards; }
    .m2    { animation-delay: .22s; }
    .m3    { animation-delay: .44s; }
    .tag   { opacity: 0; animation: rise .5s ease-out forwards; }
    .g2    { animation-delay: .95s; }
    .g3    { animation-delay: 1.15s; }
    .g1    { animation-delay: .75s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .draw { animation: none; stroke-dashoffset: 0; }
      .tag  { animation: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="330" fill="url(#bg)"/>

    <!-- field rows: the input the model reads -->
    <g clip-path="url(#panel)" opacity=".85">
      <g class="row">
        <path d="M660 62 H1180" opacity=".55"/>
        <path d="M652 94 H1180" opacity=".6"/>
        <path d="M646 126 H1180" opacity=".65"/>
        <path d="M640 158 H1180" opacity=".7"/>
        <path d="M646 190 H1180" opacity=".65"/>
        <path d="M652 222 H1180" opacity=".6"/>
        <path d="M660 254 H1180" opacity=".55"/>
        <path d="M668 286 H1180" opacity=".45"/>
      </g>
      <g fill="#3A5245" opacity=".5">
        <circle cx="742" cy="126" r="2"/><circle cx="836" cy="94" r="2"/><circle cx="918" cy="190" r="2"/>
        <circle cx="1004" cy="158" r="2"/><circle cx="1086" cy="254" r="2"/><circle cx="880" cy="286" r="2"/>
        <circle cx="1120" cy="94" r="2"/><circle cx="790" cy="222" r="2"/>
      </g>
    </g>

    <!-- predicted regions -->
    <g clip-path="url(#panel)">
      <polygon class="mask draw" pathLength="100" points="700,74 812,60 858,104 830,150 726,146 688,110"/>
      <polygon class="mask draw m2" pathLength="100" points="884,138 998,120 1044,172 1006,224 902,214 872,176"/>
      <polygon class="mask draw m3" pathLength="100" points="762,206 856,196 892,244 848,290 764,282 740,244"/>

      <g class="tag g1">
        <text class="cls" x="700" y="46">flood extent</text>
        <text class="conf" x="796" y="46">0.97</text>
      </g>
      <g class="tag g2">
        <text class="cls" x="884" y="110">crop parcel</text>
        <text class="conf" x="972" y="110">0.94</text>
      </g>
      <g class="tag g3">
        <text class="cls" x="762" y="182">safety gear</text>
        <text class="conf" x="850" y="182">0.91</text>
      </g>
    </g>

    <!-- identity -->
    <text class="name" x="72" y="146">Nizam ul Din Qureshi</text>
    <rect x="74" y="170" width="300" height="2" fill="url(#rule)"/>
    <text class="role" x="72" y="208">AI engineer · Co-founder, Earthrenewal.AI</text>
    <text class="sub"  x="72" y="240">Computer vision, NLP and generative systems,</text>
    <text class="sub"  x="72" y="262">shipped end to end rather than left in notebooks.</text>

    <rect width="1199" height="329" x=".5" y=".5" rx="14" fill="none" stroke="#2A3B33"/>
  </g>
</svg>
